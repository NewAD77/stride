<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stride">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root { color-scheme: light; --indigo:#4f46e5; --violet:#7c3aed; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:#f4f5f8; color:#161a1f;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
.topbar { background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff;
  padding:calc(env(safe-area-inset-top) + 16px) 18px 18px; display:flex; align-items:center; gap:12px; }
.topbar h1 { margin:0; font-size:22px; }
.topbar .sub { opacity:.85; font-size:13px; margin-top:2px; }
.back { background:rgba(255,255,255,.2); border:none; color:#fff; font-size:16px; font-weight:600;
  border-radius:10px; padding:6px 12px; cursor:pointer; }
.wrap { padding:16px 14px 90px; max-width:640px; margin:0 auto; }
.cards { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
.card { background:#fff; border:1px solid #e7e9ee; border-radius:16px; padding:13px 15px; }
.card .k { font-size:11px; color:#7a828c; text-transform:uppercase; letter-spacing:.05em; }
.card .v { font-size:24px; font-weight:680; margin-top:3px; }
.card .v small { font-size:13px; font-weight:500; color:#7a828c; }
.panel { background:#fff; border:1px solid #e7e9ee; border-radius:16px; padding:15px 16px; margin-bottom:14px; }
.panel.tap { cursor:pointer; transition:transform .08s; }
.panel.tap:active { transform:scale(.99); }
.panel h2 { font-size:14px; margin:0 0 4px; display:flex; justify-content:space-between; align-items:center; }
.panel h2 .chev { color:#c2c7cf; font-weight:700; }
.panel .hint { font-size:11px; color:#9aa0a8; }
.chart-box { position:relative; height:200px; margin-top:8px; }
.chart-box.tall { height:260px; }
.ai { background:linear-gradient(135deg,#eef0ff,#f6f2ff); border-color:#e2e3f6; }
.ai h2 { gap:7px; justify-content:flex-start; }
.ai .badge { font-size:9px; background:var(--indigo); color:#fff; padding:2px 7px; border-radius:20px; }
.ai p { margin:0; font-size:14.5px; line-height:1.5; }
.banner { border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:13.5px; line-height:1.45; }
.banner.warn { background:#fff8e6; border:1px solid #f3dd93; color:#7a5b00; }
.banner.connect { background:#fff; border:1px solid #e2e3f6; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.banner.connect .t { font-size:13px; color:#4a4f57; }
.btn { color:#fff; text-decoration:none; font-weight:650; font-size:14px; padding:10px 16px; border-radius:12px; white-space:nowrap; display:inline-block; }
.tag { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.05em; }
.tag.live { background:#e7f6ec; color:#177245; } .tag.demo { background:#eef0f3; color:#7a828c; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:right; padding:7px 6px; border-bottom:1px solid #eef0f3; white-space:nowrap; }
th:first-child,td:first-child { text-align:left; }
th { color:#7a828c; font-weight:600; font-size:10px; text-transform:uppercase; }
.pill { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; font-weight:600; }
.pill.ok { background:#e7f6ec; color:#177245; } .pill.no { background:#fdecec; color:#c0392b; }
.muted { color:#9aa0a8; font-size:11.5px; margin-top:8px; }
.foot { text-align:center; color:#aab0b8; font-size:11px; margin-top:18px; }
.chips { display:flex; gap:8px; margin:2px 0 14px; flex-wrap:wrap; }
.chip { background:#fff; border:1px solid #e0e3e8; color:#4a4f57; font-size:12.5px; font-weight:600;
  padding:7px 13px; border-radius:20px; cursor:pointer; }
.chip.on { background:var(--indigo); border-color:var(--indigo); color:#fff; }
.section-title { font-size:13px; font-weight:700; color:#4a4f57; margin:2px 2px 8px; }
.loading { text-align:center; color:#8a9099; padding:40px 0; }
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="wrap" id="content"><div class="loading">Loading…</div></div>

<script>
/* ---------------- data ---------------- */
const DEMO = [
 {d:"2026-05-02",m:8011,t:3164,mps:2.532,c:79,e:116,el:64,g:true},
 {d:"2026-05-13",m:7752,t:2652,mps:2.923,c:82,e:167,el:67,g:true},
 {d:"2026-05-31",m:21330,t:7647,mps:2.789,c:81,e:574,el:256,g:true},
 {d:"2026-06-13",m:5019,t:1698,mps:2.956,c:85,e:119,el:23,g:true},
 {d:"2026-06-24",m:5017,t:1677,mps:2.992,c:84,e:104,el:37,g:true},
 {d:"2026-07-22",m:5015,t:1788,mps:2.805,c:81,e:29,el:0,g:false},
 {d:"2026-07-26",m:5020,t:1958,mps:2.564,c:77,e:49,el:0,g:false}
];
const state = { runs:[], oura:null, withings:null, live:false, view:"home", range:"12W", rf:"all" };
let charts = [];
function clearCharts(){ charts.forEach(c=>{ try{c.destroy();}catch(e){} }); charts=[]; }

/* ---------------- helpers ---------------- */
const fmtPace=m=>{if(!m)return"–";const s=1000/m,x=Math.floor(s/60),y=Math.round(s-x*60);return x+":"+String(y).padStart(2,"0");};
const fmtDur=s=>{const h=Math.floor(s/3600),m=Math.round((s-h*3600)/60);return h>0?h+"h "+m+"m":m+"m";};
function wkKey(d){const t=new Date(d);const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day);
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
const wkLbl=k=>{const p=k.split("-");return p[1]+"/"+p[2];};
const md=d=>d.slice(5);
function anchor(){ let ds=state.runs.map(r=>r.d);
  if(state.oura&&state.oura.days) ds=ds.concat(state.oura.days.map(x=>x.day));
  if(state.withings&&state.withings.series) ds=ds.concat(state.withings.series.map(x=>x.date));
  const t=ds.map(x=>+new Date(x)).filter(n=>!isNaN(n)); return t.length?new Date(Math.max.apply(null,t)):new Date(); }
function rangeStartMs(){ const days=state.range==="4W"?28:state.range==="12W"?84:100000; return anchor().getTime()-days*864e5; }
const inRange=d=>+new Date(d)>=rangeStartMs();
function runsSorted(){ return state.runs.slice().sort((a,b)=>new Date(a.d)-new Date(b.d)); }
function runsInRange(){ return runsSorted().filter(r=>inRange(r.d)); }

const card=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const gx={grid:{color:"#eef0f3"},ticks:{color:"#8a9099",font:{size:10}}};
const co={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};

/* ---------------- coach note ---------------- */
function coachNote(runs){
  if(!runs.length) return "";
  const n=runs.length, km=runs.reduce((s,r)=>s+r.m,0)/1000, cad=Math.round(runs.reduce((s,r)=>s+r.c,0)/n);
  const gps=runs.filter(r=>r.g), noGps=runs.filter(r=>!r.g).length;
  const fastest=gps.length?gps.reduce((a,b)=>b.mps>a.mps?b:a):runs[0];
  let s=`Over these ${n} runs you covered ${km.toFixed(0)} km with steady, repeatable volume. `;
  s+=`Cadence averages about ${cad} spm`+(fastest?`, and your sharpest well-tracked 5k pace was around ${fmtPace(fastest.mps)}/km. `:`. `);
  if(noGps) s+=`Note: ${noGps} recent run(s) recorded without GPS, so their pace is an estimate. `;
  const hot=runs.filter(r=>r.wx&&r.wx.tmax!=null).reduce((a,b)=>(a&&a.wx.tmax>=b.wx.tmax?a:b),null);
  if(hot&&hot.wx.tmax>=25) s+=`Your ${md(hot.d)} run hit about ${Math.round(hot.wx.tmax)}°C — heat adds ~10–20 sec/km, so don't read a hot-day slowdown as lost fitness. `;
  if(state.oura&&state.oura.connected&&state.oura.days&&state.oura.days.length){
    const r=state.oura.days[state.oura.days.length-1].readiness;
    if(r!=null) s+=`Latest Oura readiness is ${r}${r<70?" — a good day to keep it easy":" — you're recovered enough for quality"}. `;
  }
  s+=`Tap any card below for the full trend.`;
  return s;
}

/* ---------------- HOME ---------------- */
function renderHome(){
  clearCharts();
  const runs=runsSorted();
  document.getElementById("topbar").innerHTML =
    `<div><h1>Stride</h1><div class="sub">${runs.length?md0(runs[0].d)+" → "+md0(runs[runs.length-1].d):""} <span class="tag ${state.live?'live':'demo'}">${state.live?'LIVE':'DEMO'}</span></div></div>`;
  if(!runs.length){ document.getElementById("content").innerHTML='<div class="loading">No runs found.</div>'; return; }

  const totalM=runs.reduce((s,r)=>s+r.m,0), totalT=runs.reduce((s,r)=>s+r.t,0);
  const avgMps=totalM/totalT, noGps=runs.filter(r=>!r.g);
  let h="";
  if(!state.live) h+=`<div class="banner connect"><span class="t">Demo data. Connect Strava for your live training.</span><a class="btn" style="background:#fc4c02" href="/api/strava/login">Connect with Strava</a></div>`;
  h+=`<div data-open="runs" style="cursor:pointer"><div class="cards">${card("Runs",runs.length)}${card("Distance",(totalM/1000).toFixed(0)+' <small>km</small>')}${card("Time",fmtDur(totalT))}${card("Avg pace",fmtPace(avgMps)+' <small>/km</small>')}</div></div>`;
  if(noGps.length) h+=`<div class="banner warn">⚠️ <b>${noGps.length} recent run(s) recorded without GPS</b> — distance was watch-estimated, so their pace is approximate.</div>`;

  if(state.oura&&state.oura.connected&&state.oura.days&&state.oura.days.length){
    const l=state.oura.days[state.oura.days.length-1];
    h+=`<div class="panel tap" data-open="recovery"><h2>Recovery <span class="chev">›</span></h2><div class="hint">latest from Oura · ${md(l.day)}</div>
      <div class="cards" style="margin-top:8px">${card("Readiness",l.readiness??"–")}${card("Sleep",l.sleep??"–")}${card("HRV",l.hrv!=null?l.hrv+' <small>ms</small>':"–")}${card("Resting HR",l.rhr!=null?l.rhr+' <small>bpm</small>':"–")}</div></div>`;
  }
  if(state.withings&&state.withings.connected&&state.withings.series&&state.withings.series.length){
    const l=state.withings.series[state.withings.series.length-1];
    h+=`<div class="panel tap" data-open="body"><h2>Body composition <span class="chev">›</span></h2><div class="hint">latest from Withings · ${md(l.date)}</div>
      <div class="cards" style="margin-top:8px">${card("Weight",l.weight!=null?l.weight+' <small>kg</small>':"–")}${card("Body fat",l.fat!=null?l.fat+' <small>%</small>':"–")}${card("Muscle",l.muscle!=null?l.muscle+' <small>kg</small>':"–")}${card("Fat mass",l.fatmass!=null?l.fatmass+' <small>kg</small>':"–")}</div></div>`;
  } else if(state.live){
    h+=`<div class="banner connect"><span class="t">Add body-composition trends from your Withings scale.</span><a class="btn" style="background:#00a6de" href="/api/withings/login">Connect Withings</a></div>`;
  }

  h+=`<div class="panel ai"><h2>🧠 Coach's read <span class="badge">v1</span></h2><p>${coachNote(runs)}</p></div>`;
  h+=tapChart("Weekly volume","kilometres per week","volume","wk");
  h+=tapChart("Pace trend","per run · higher = faster · red = no GPS","pace","pc");
  h+=tapChart("Cadence trend","steps per minute","cadence","cd");
  h+=tapChart("Training load","weekly relative effort","load","ld");

  const recent=runs.slice(-8).reverse();
  h+=`<div class="panel tap" data-open="runs"><h2>Recent runs <span class="chev">›</span></h2><div class="hint">all distances · tap for full list &amp; filters</div>
    <table style="margin-top:10px"><thead><tr><th>Date</th><th>Dist</th><th>Pace</th><th>Cad</th><th>Temp</th></tr></thead><tbody>`+
    recent.map(r=>`<tr><td>${md(r.d)}</td><td>${(r.m/1000).toFixed(1)}</td><td>${fmtPace(r.mps)}</td><td>${r.c||"–"}</td><td>${r.wx&&r.wx.t!=null?Math.round(r.wx.t)+"°":"–"}</td></tr>`).join("")+
    `</tbody></table></div>`;

  h+=`<div class="foot"><b>Stride</b> · ${state.live?'live from Strava · Oura · Withings · weather':'demo mode'}.<br>Tap any card for the full trend and history.</div>`;
  document.getElementById("content").innerHTML=h;

  drawVolume("wk"); drawPace("pc"); drawCadence("cd"); drawLoad("ld");
}
const md0=d=>d.slice(0,10);
function tapChart(title,hint,open,id){ return `<div class="panel tap" data-open="${open}"><h2>${title} <span class="chev">›</span></h2><div class="hint">${hint}</div><div class="chart-box"><canvas id="${id}"></canvas></div></div>`; }

/* ---------------- chart drawers (accept a list of runs) ---------------- */
function drawVolume(id, runs){ runs=runs||runsSorted();
  const wk={}; runs.forEach(r=>{const k=wkKey(r.d); wk[k]=wk[k]||{km:0,n:0}; wk[k].km+=r.m/1000; wk[k].n++;});
  const weeks=Object.keys(wk).sort();
  charts.push(new Chart(document.getElementById(id),{type:"bar",data:{labels:weeks.map(wkLbl),datasets:[{data:weeks.map(k=>+wk[k].km.toFixed(1)),backgroundColor:"#4f46e5",borderRadius:6}]},options:{...co,scales:{x:gx,y:{...gx,beginAtZero:true}}}}));
}
function drawPace(id, runs){ runs=runs||runsSorted();
  charts.push(new Chart(document.getElementById(id),{type:"line",data:{labels:runs.map(r=>md(r.d)),datasets:[{data:runs.map(r=>+(1000/r.mps/60).toFixed(3)),borderColor:"#0ea5e9",backgroundColor:"rgba(14,165,233,.12)",fill:true,tension:.3,pointRadius:3,pointBackgroundColor:runs.map(r=>r.g?"#0ea5e9":"#c0392b")}]},options:{...co,plugins:{...co.plugins,tooltip:{callbacks:{label:c=>{const m=Math.floor(c.raw),s=Math.round((c.raw-m)*60);return m+":"+String(s).padStart(2,"0")+"/km"+(runs[c.dataIndex].g?"":" (no GPS)");}}}},scales:{x:gx,y:{...gx,reverse:true}}}}));
}
function drawCadence(id, runs){ runs=runs||runsSorted();
  charts.push(new Chart(document.getElementById(id),{type:"line",data:{labels:runs.map(r=>md(r.d)),datasets:[{data:runs.map(r=>r.c),borderColor:"#16a34a",backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.3,pointRadius:2}]},options:{...co,scales:{x:gx,y:gx}}}));
}
function drawLoad(id, runs){ runs=runs||runsSorted();
  const wk={}; runs.forEach(r=>{const k=wkKey(r.d); wk[k]=(wk[k]||0)+r.e;});
  const weeks=Object.keys(wk).sort();
  charts.push(new Chart(document.getElementById(id),{type:"bar",data:{labels:weeks.map(wkLbl),datasets:[{data:weeks.map(k=>wk[k]),backgroundColor:"#f59e0b",borderRadius:6}]},options:{...co,scales:{x:gx,y:{...gx,beginAtZero:true}}}}));
}

/* ---------------- DETAIL ---------------- */
const TITLES={volume:"Weekly volume",pace:"Pace trend",cadence:"Cadence trend",load:"Training load",recovery:"Recovery",body:"Body composition",runs:"All runs"};
function openDetail(kind){ state.view=kind; renderDetail(); window.scrollTo(0,0); }
function rangeChips(){ return `<div class="chips">${["4W","12W","All"].map(r=>`<div class="chip ${state.range===r?'on':''}" data-range="${r}">${r==="4W"?"4 weeks":r==="12W"?"12 weeks":"All"}</div>`).join("")}</div>`; }

function renderDetail(){
  clearCharts();
  const kind=state.view;
  document.getElementById("topbar").innerHTML=`<button class="back" data-back>‹ Back</button><h1 style="font-size:19px">${TITLES[kind]||""}</h1>`;
  let h="";
  if(kind!=="runs") h+=rangeChips();

  if(kind==="volume"||kind==="pace"||kind==="cadence"||kind==="load"){
    const runs=runsInRange();
    h+=`<div class="panel"><div class="chart-box tall"><canvas id="dc"></canvas></div></div>`;
    if(kind==="volume"||kind==="load"){
      const wk={}; runs.forEach(r=>{const k=wkKey(r.d); wk[k]=wk[k]||{km:0,e:0,n:0}; wk[k].km+=r.m/1000; wk[k].e+=r.e; wk[k].n++;});
      const weeks=Object.keys(wk).sort().reverse();
      h+=`<div class="panel"><table><thead><tr><th>Week of</th><th>Runs</th><th>km</th><th>Effort</th></tr></thead><tbody>`+
        weeks.map(k=>`<tr><td>${wkLbl(k)}</td><td>${wk[k].n}</td><td>${wk[k].km.toFixed(1)}</td><td>${wk[k].e}</td></tr>`).join("")+`</tbody></table></div>`;
    } else {
      const rev=runs.slice().reverse();
      h+=`<div class="panel"><table><thead><tr><th>Date</th><th>Dist</th><th>Pace</th><th>Cad</th><th>Temp</th></tr></thead><tbody>`+
        rev.map(r=>`<tr><td>${md(r.d)}</td><td>${(r.m/1000).toFixed(1)}</td><td>${fmtPace(r.mps)}</td><td>${r.c||"–"}</td><td>${r.wx&&r.wx.t!=null?Math.round(r.wx.t)+"°":"–"}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    document.getElementById("content").innerHTML=h;
    if(kind==="volume") drawVolume("dc",runs);
    if(kind==="pace") drawPace("dc",runs);
    if(kind==="cadence") drawCadence("dc",runs);
    if(kind==="load") drawLoad("dc",runs);
    return;
  }

  if(kind==="recovery"){
    const days=(state.oura&&state.oura.days||[]).filter(x=>inRange(x.day));
    h+=`<div class="panel"><div class="hint">Readiness &amp; sleep score</div><div class="chart-box tall"><canvas id="dc"></canvas></div></div>`;
    const rev=days.slice().reverse();
    h+=`<div class="panel"><table><thead><tr><th>Date</th><th>Ready</th><th>Sleep</th><th>HRV</th><th>RHR</th></tr></thead><tbody>`+
      rev.map(x=>`<tr><td>${md(x.day)}</td><td>${x.readiness??"–"}</td><td>${x.sleep??"–"}</td><td>${x.hrv??"–"}</td><td>${x.rhr??"–"}</td></tr>`).join("")+`</tbody></table></div>`;
    document.getElementById("content").innerHTML=h;
    charts.push(new Chart(document.getElementById("dc"),{type:"line",data:{labels:days.map(x=>md(x.day)),datasets:[
      {label:"Readiness",data:days.map(x=>x.readiness??null),borderColor:"#4f46e5",tension:.3,pointRadius:2,spanGaps:true},
      {label:"Sleep",data:days.map(x=>x.sleep??null),borderColor:"#0ea5e9",tension:.3,pointRadius:2,spanGaps:true}]},
      options:{...co,plugins:{legend:{display:true,labels:{font:{size:11}}}},scales:{x:gx,y:{...gx,beginAtZero:true,max:100}}}}));
    return;
  }

  if(kind==="body"){
    const s=(state.withings&&state.withings.series||[]).filter(x=>inRange(x.date));
    h+=`<div class="panel"><div class="hint">Weight (kg)</div><div class="chart-box tall"><canvas id="dc"></canvas></div></div>`;
    const rev=s.slice().reverse();
    h+=`<div class="panel"><table><thead><tr><th>Date</th><th>Weight</th><th>Fat %</th><th>Muscle</th></tr></thead><tbody>`+
      rev.map(x=>`<tr><td>${md(x.date)}</td><td>${x.weight??"–"}</td><td>${x.fat??"–"}</td><td>${x.muscle??"–"}</td></tr>`).join("")+`</tbody></table></div>`;
    document.getElementById("content").innerHTML=h;
    charts.push(new Chart(document.getElementById("dc"),{type:"line",data:{labels:s.map(x=>md(x.date)),datasets:[{data:s.map(x=>x.weight??null),borderColor:"#4f46e5",backgroundColor:"rgba(79,70,229,.12)",fill:true,tension:.3,pointRadius:2,spanGaps:true}]},options:{...co,scales:{x:gx,y:gx}}}));
    return;
  }

  if(kind==="runs"){
    const buckets={all:()=>true, "5k":r=>r.m>=4500&&r.m<=5500, "10k":r=>r.m>=9000&&r.m<=11000, long:r=>r.m>12000};
    h+=`<div class="chips">${[["all","All"],["5k","~5k"],["10k","~10k"],["long","Long (12k+)"]].map(([k,lab])=>`<div class="chip ${state.rf===k?'on':''}" data-filter="${k}">${lab}</div>`).join("")}</div>`;
    const list=runsSorted().filter(buckets[state.rf]).reverse();
    const cnt=list.length, km=list.reduce((s,r)=>s+r.m,0)/1000;
    h+=`<div class="section-title">${cnt} runs · ${km.toFixed(0)} km</div>`;
    h+=`<div class="panel"><table><thead><tr><th>Date</th><th>Dist</th><th>Time</th><th>Pace</th><th>Cad</th><th>Temp</th><th>GPS</th></tr></thead><tbody>`+
      list.map(r=>`<tr><td>${md(r.d)}</td><td>${(r.m/1000).toFixed(2)}</td><td>${fmtDur(r.t)}</td><td>${fmtPace(r.mps)}</td><td>${r.c||"–"}</td><td>${r.wx&&r.wx.t!=null?Math.round(r.wx.t)+"°":"–"}</td><td>${r.g?'<span class="pill ok">yes</span>':'<span class="pill no">no</span>'}</td></tr>`).join("")+
      `</tbody></table><div class="muted">Filter by distance to compare like-for-like efforts. Same-distance runs on your usual routes track fitness directly.</div></div>`;
    document.getElementById("content").innerHTML=h;
    return;
  }
}

/* ---------------- events + boot ---------------- */
document.addEventListener("click",(e)=>{
  const o=e.target.closest("[data-open]"); if(o){ openDetail(o.getAttribute("data-open")); return; }
  const r=e.target.closest("[data-range]"); if(r){ state.range=r.getAttribute("data-range"); renderDetail(); return; }
  const f=e.target.closest("[data-filter]"); if(f){ state.rf=f.getAttribute("data-filter"); renderDetail(); return; }
  const b=e.target.closest("[data-back]"); if(b){ state.view="home"; state.range="12W"; renderHome(); return; }
});

async function boot(){
  try{ const o=await fetch("/api/oura",{credentials:"same-origin"}); if(o.ok) state.oura=await o.json(); }catch(e){}
  try{ const w=await fetch("/api/withings/measures",{credentials:"same-origin"}); if(w.ok) state.withings=await w.json(); }catch(e){}
  try{
    const res=await fetch("/api/strava/activities",{credentials:"same-origin"});
    if(res.ok){ const data=await res.json(); if(data.runs&&data.runs.length){ state.runs=data.runs; state.live=true; renderHome(); return; } }
  }catch(e){}
  state.runs=DEMO; state.live=false; renderHome();
}
boot();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
